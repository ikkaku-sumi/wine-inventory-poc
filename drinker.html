<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cellar Note — 体験デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#8b1028; --wine-weak:#f8e9ed; --wine-bd:#e8d2d8;
    --ink:#241f1d; --ink-2:#4a4340; --muted:#756d68;
    --bg:#f7f4ee; --card:#fffdfa; --surface-muted:#f4efe8; --line:#e2d8cf; --line-2:#d6ccbf;
    --green:#277a47; --green-bg:#edf7f0; --amber:#94651f; --amber-bg:#fbf3e4;
    --open:#a8571b; --open-bg:#fbeedd;
    --r-card:12px;
    --sans:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    --serif:"Noto Serif JP","Hiragino Mincho ProN",serif;
    --latin:"Cormorant Garamond","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#ebe9e5;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:32px 16px 56px}
  .intro{max-width:560px;text-align:center;margin-bottom:20px}
  .intro .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--wine);
    background:var(--wine-weak);border:1px solid var(--wine-bd);padding:4px 12px;border-radius:99px;margin-bottom:12px}
  .intro h1{font-size:23px;font-weight:700;margin:0 0 8px;line-height:1.45}
  .intro p{font-size:14px;color:var(--ink-2);margin:0}
  .phone{width:400px;max-width:100%;background:#17181a;border-radius:42px;padding:12px;box-shadow:0 18px 50px rgba(24,20,22,.28)}
  .scr{background:var(--bg);border-radius:32px;overflow:hidden;height:800px;display:flex;flex-direction:column;position:relative}
  .foot{max-width:560px;text-align:center;margin-top:18px;font-size:12px;color:#8a8481;line-height:1.9}

  /* ============ chrome ============ */
  .top{padding:15px 18px 6px;display:flex;align-items:center;gap:10px;min-height:52px}
  .top .brand{font-family:var(--latin);font-weight:600;font-size:22px;letter-spacing:.02em}
  .top .ttl{font-size:18px;font-weight:700}
  .top .sp{margin-left:auto;display:flex;align-items:center;gap:11px}
  .icbtn{all:unset;cursor:pointer;color:var(--ink-2);display:flex;position:relative;padding:2px}
  .icbtn svg{width:21px;height:21px}
  .icbtn .nb{position:absolute;top:-3px;right:-4px;background:var(--wine);color:#fff;font-size:8.5px;font-weight:700;
    width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .area{all:unset;cursor:pointer;font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:99px;padding:5px 12px;color:var(--ink-2);background:var(--card)}
  .phasebtn{all:unset;cursor:pointer;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#8d8580;background:#e8e2d9;padding:3px 8px;border-radius:5px}
  .view{flex:1;overflow-y:auto;padding:0 16px 104px}

  /* bottom bar with center camera action */
  .tabs{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:rgba(255,255,255,.97);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:3}
  .tab{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--wine)}
  .camtab{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--wine);padding:0 0 6px}
  .camtab .ring{width:52px;height:52px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;
    margin-top:-20px;box-shadow:0 6px 16px rgba(139,16,40,.36);border:3px solid var(--card)}
  .camtab .ring svg{width:24px;height:24px}

  .sec{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);margin:18px 2px 9px;display:flex;align-items:baseline}
  .sec .r{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--muted);display:flex;gap:11px;align-items:center}
  .hint{text-align:center;font-size:11.5px;color:var(--muted);padding:12px 12px 18px;line-height:1.85}
  .synced{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:2px 2px 12px}
  .synced svg{width:13px;height:13px}

  /* ============ shared ============ */
  .card{background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:15px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(40,25,20,.04),0 5px 16px rgba(40,25,20,.04)}
  .card.tap{cursor:pointer}
  .btn{all:unset;cursor:pointer;font-size:14px;font-weight:700;color:var(--wine);border:1.5px solid var(--wine);
    padding:13px 16px;border-radius:10px;text-align:center;display:block;width:100%;box-sizing:border-box}
  .btn.fill{background:var(--wine);color:#fff;border-color:var(--wine)}
  .btn.sm{font-size:13px;padding:10px 14px}
  .btn .ic{display:inline-flex;vertical-align:-3px;margin-right:7px}
  .btn .ic svg{width:17px;height:17px}
  .tlink{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--wine)}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px}
  .tchip{all:unset;cursor:pointer;font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:99px;padding:5.5px 13px;color:var(--ink-2);background:var(--card);white-space:nowrap}
  .tchip.on{background:var(--wine);border-color:var(--wine);color:#fff}
  .tchip.gr.on{background:var(--green);border-color:var(--green);color:#fff}
  .search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:11px 14px;color:var(--muted);font-size:13px;margin:10px 0;cursor:pointer}
  .search svg{width:16px;height:16px;flex:none}
  .seg{display:flex;border:1.5px solid var(--wine);border-radius:10px;overflow:hidden;margin:2px 0 10px}
  .seg button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--wine);padding:9px 0}
  .seg button.on{background:var(--wine);color:#fff}
  .wname{font-family:var(--latin);font-size:17.5px;font-weight:600;line-height:1.3}
  .wsub{font-size:12px;color:var(--ink-2);margin-top:2px}
  .meta{font-size:11.5px;color:var(--muted)}
  .chev{flex:none;color:var(--line-2);font-size:22px;align-self:center;line-height:1}
  .open{color:var(--green);font-weight:700}
  .opt{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1.5px 7px;margin-left:auto}

  /* 根拠バッジ: 確度の異なる主張を同じ見た目にしない（仕様§3.1/§3.2） */
  .ev{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 8px}
  .ev svg{width:12px;height:12px}
  .ev.stock{background:var(--green-bg);color:var(--green)}
  .ev.low{background:var(--amber-bg);color:var(--amber)}
  .ev.unknown{background:var(--surface-muted);color:var(--ink-2);border:1px solid var(--line)}
  .ev.stale{background:var(--amber-bg);color:var(--amber);border:1px dashed #d8bd85}
  .ev.arrival{background:var(--surface-muted);color:var(--ink-2)}
  .ev.evid{background:var(--surface-muted);color:var(--muted)}
  .ev.opennow{background:var(--open-bg);color:var(--open)}
  .fresh{font-size:10.5px;color:var(--muted)}
  .evrow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}

  /* ============ label art (200x267固定→transform縮小) ============ */
  .fitwrap{position:relative;width:100%}
  .fitin{position:absolute;top:0;left:0;width:200px;transform-origin:top left}
  .lab{width:200px;height:267px;border-radius:8px;border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 8px rgba(30,20,15,.14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:20px 14px 16px;background:#fbf7ee;position:relative;overflow:hidden}
  .lab .prod{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5a4f42;font-family:var(--latin);line-height:1.3}
  .lab .nm{font-family:var(--latin);font-weight:600;line-height:1.2;margin:12px 0;font-size:21px;color:#241d16}
  .lab .vt{font-family:var(--latin);font-size:11px;letter-spacing:.16em;color:#6a5c4c}
  .lab .rule{width:64px;height:1px;background:#b9a88e;margin-bottom:10px}
  .lab .band{position:absolute;top:0;left:0;right:0;height:18px}
  .band.red{background:#7b1f2b}.band.white{background:#d9c46a}.band.spark{background:#c8b98d}
  .lab.s-classic{background:linear-gradient(#fdfaf2,#f3ecd9)}
  .lab.s-classic::before,.lab.s-cream::before{content:"";position:absolute;inset:26px 12px 12px;border:1px solid #c9b48a;border-radius:4px}
  .lab.s-script .nm{font-style:italic;font-size:23px}
  .lab.s-dark{background:#2b2226}
  .lab.s-dark .prod{color:#c9b6a2}.lab.s-dark .nm{color:#f2e7d8}.lab.s-dark .vt{color:#b6a48f}.lab.s-dark .rule{background:#7a6a58}
  .lab.s-gold{background:linear-gradient(160deg,#fbf6e8,#f1e3bd)}
  .lab.s-mint{background:linear-gradient(#f6faf3,#e8f0e2)}
  .lab.s-jp .nm{font-family:var(--serif);font-size:18px;font-weight:600}
  .vphoto{border-radius:10px;overflow:hidden;position:relative;flex:none;display:flex;align-items:flex-end}
  .vphoto span{font-family:var(--latin);color:rgba(255,255,255,.85);font-size:13px;padding:6px 9px;letter-spacing:.06em}
  .vp-h{background:linear-gradient(140deg,#3a2b25,#6b4a35 45%,#2a1e1a)}
  .vp-a{background:linear-gradient(140deg,#25303a,#5a6a5a 50%,#1d2422)}
  .vp-n{background:linear-gradient(140deg,#40342a,#8a6a3a 50%,#2c2118)}

  /* ============ 記録タブ ============ */
  .startcard{background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:22px 18px;text-align:center;margin:8px 0 14px;
    box-shadow:0 1px 2px rgba(40,25,20,.04),0 5px 16px rgba(40,25,20,.04)}
  .startcard .bigic{width:56px;height:56px;border-radius:50%;background:var(--wine-weak);color:var(--wine);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .startcard .bigic svg{width:26px;height:26px}
  .startcard h2{font-size:17px;font-weight:700;margin:0 0 5px}
  .startcard p{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.75}
  .prof .h{display:flex;align-items:baseline;gap:8px}
  .prof .h b{font-size:13.5px}
  .prof .chiprow{margin-top:10px}
  .prof .tchip{cursor:default}
  .prof-cta{border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
  .entry{display:flex;gap:13px;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:12px 13px;margin-bottom:10px;cursor:pointer;
    box-shadow:0 1px 2px rgba(40,25,20,.04)}
  .entry.justsaved{background:var(--wine-weak);border-color:var(--wine-bd)}
  .entry .th{width:48px;flex:none}
  .entry .bd{flex:1;min-width:0}
  .entry .when{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .entry .wname{font-size:15px;margin-top:2px}
  .entry .mtai{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--wine);margin-top:5px}
  .entry .mtai svg{width:13px;height:13px}
  .entry .memo{font-size:12.5px;color:var(--ink-2);margin-top:7px;padding:1px 0 1px 12px;border-left:2px solid var(--line-2);line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ratechip{margin-left:auto;flex:none;align-self:flex-start;font-size:11px;font-weight:700;border-radius:99px;padding:3px 11px}
  .ratechip.like{background:var(--wine-weak);color:var(--wine)}
  .ratechip.mid{background:#efece7;color:var(--ink-2)}
  .badge{font-size:9.5px;font-weight:700;border-radius:99px;padding:2px 8px}
  .badge.auto{background:var(--wine-weak);color:var(--wine)}
  .badge.hand{background:var(--green-bg);color:var(--green)}

  /* ============ 発見系 ============ */
  .vcard{display:flex;gap:14px;align-items:stretch}
  .vcard .vphoto{width:96px;min-height:96px}
  .vcard .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .vcard .vn{font-size:14.5px;font-weight:700}
  .wrow{display:flex;gap:13px;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:12px 13px;margin-bottom:10px;cursor:pointer;
    box-shadow:0 1px 2px rgba(40,25,20,.04);align-items:center}
  .wrow.hl{background:var(--wine-weak);border-color:var(--wine-bd)}
  .wrow.opencard{background:var(--open-bg);border-color:#eed9bd}
  .wrow .th{width:52px;flex:none}
  .wrow .bd{flex:1;min-width:0}
  .hltag{display:inline-block;font-size:10px;font-weight:700;color:var(--wine);margin-bottom:4px}
  .jgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;margin-top:4px}
  .jitem{all:unset;cursor:pointer;display:block;min-width:0}
  .jitem .cap{display:block;margin-top:8px;line-height:1.4}
  .jitem .cap .n{font-size:12px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .jitem .cap .s{font-size:10.5px;color:var(--muted);display:block;margin-top:1px}
  .viewtoggle{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink-2);
    border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;background:var(--card)}
  .viewtoggle svg{width:14px;height:14px}
  .empty{text-align:center;padding:22px 10px 8px}
  .empty .art{width:120px;height:74px;margin:0 auto 18px;border-radius:10px;background:var(--surface-muted);display:flex;align-items:center;justify-content:center;color:#c3b8ab}
  .empty .art svg{width:44px;height:44px}
  .empty h2{font-size:17px;font-weight:700;margin:0 0 8px;line-height:1.5}
  .empty p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.8}
  .empty .btn{margin-bottom:10px}

  /* ============ overlay / task ============ */
  .ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
  .ov .bar{display:flex;align-items:center;padding:13px 16px;position:relative;flex:none}
  .ov .bar .c{position:absolute;left:0;right:0;text-align:center;font-size:15.5px;font-weight:700;pointer-events:none}
  .back{all:unset;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:13.5px;font-weight:700;color:var(--wine);z-index:1}
  .back svg{width:18px;height:18px}
  .ov .bar .sp{margin-left:auto;display:flex;gap:12px;align-items:center;z-index:1}
  .ov .body{flex:1;overflow-y:auto;padding:0 18px 34px}
  .detail-lab{width:104px;margin:4px auto 14px}
  .d-name{font-family:var(--latin);font-size:23px;font-weight:600;text-align:center;line-height:1.25}
  .d-sub{text-align:center;font-size:13px;color:var(--ink-2);margin-top:4px}
  .pills{display:flex;gap:7px;justify-content:center;margin:11px 0 4px;flex-wrap:wrap}
  .pill{font-size:11.5px;font-weight:600;border:1px solid var(--line-2);border-radius:99px;padding:4px 12px;color:var(--ink-2);background:var(--card)}
  .pill.type{background:var(--wine);border-color:var(--wine);color:#fff}
  .avrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:11px 13px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 2px rgba(40,25,20,.04)}
  .avrow .vphoto{width:64px;min-height:58px}
  .avrow .bd{flex:1;min-width:0}
  .avrow .vn{font-size:13.5px;font-weight:700}
  .box{background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:13px 15px;font-size:13px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,25,20,.04)}
  .box .tt{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--wine);margin-bottom:6px}
  .box .src{font-size:10px;color:var(--muted);margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
  .cta{margin-top:16px}

  /* 記録フォーム */
  .wsum{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:13px 14px;box-shadow:0 1px 2px rgba(40,25,20,.04)}
  .wsum .th{width:56px;flex:none}
  .fixline{display:flex;align-items:center;justify-content:center;gap:7px;margin:11px 0 4px}
  .fixline svg{width:14px;height:14px;color:var(--wine)}
  .flabel{display:flex;align-items:center;font-size:13.5px;font-weight:700;margin:18px 2px 9px}
  .seg3{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--card)}
  .seg3 button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--ink-2);padding:12px 0;border-left:1px solid var(--line-2)}
  .seg3 button:first-child{border-left:none}
  .seg3 button.on{background:var(--wine-weak);color:var(--wine);font-weight:700}
  .togglerow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:13px 15px;margin-top:12px;font-size:13.5px;font-weight:700;cursor:pointer}
  .togglerow svg{width:17px;height:17px;color:var(--ink-2)}
  .sw{margin-left:auto;width:46px;height:27px;border-radius:99px;background:#d9d2c8;position:relative;transition:background .15s;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw.on{background:var(--wine)}
  .sw.on::after{left:22px}
  .memoarea{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card);padding:13px 15px;font-size:13px;color:var(--muted);min-height:72px}
  .detailrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:13px 15px;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--wine);cursor:pointer}
  .detailrow svg{width:17px;height:17px}
  .detailrow .chev{margin-left:auto}
  .note{text-align:center;font-size:11.5px;color:var(--muted);margin:13px 0 10px;line-height:1.8}
  .sliderbox{background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:6px 15px 12px}
  .srow{display:flex;align-items:center;gap:11px;padding:9px 0}
  .srow .l,.srow .r{font-size:11px;line-height:1.5;color:var(--ink-2);flex:none;width:82px}
  .srow .r{text-align:right}
  .srow input[type=range]{flex:1;accent-color:var(--wine);height:24px}
  .srow.unset input[type=range]{accent-color:#cfc7bd;opacity:.65}
  .srow.unset .l,.srow.unset .r{color:var(--muted)}
  .sfoot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:11px;color:var(--muted)}
  .sfoot .tlink{margin-left:auto;font-size:11.5px}

  /* 訂正 */
  .cand{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid rgba(40,25,20,.06);border-radius:var(--r-card);padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(40,25,20,.04)}

};
const evOpen = (o) => `<span class="ev opennow">${I.glass}今夜開いています</span><span class="fresh">${o.at}</span>`;

function evidenceFor(w, v){

  if (s) return evStock(s);
  const e = evidOf(w, v); if (e) return evEvidence(e);
  return "";
}

/* ================= actions ================= */
function startCamera(){ S.task = "camera"; render(); }
function shoot(){
  S.task = "reading"; render();
  setTimeout(() => { startRecord("w03", null, "camera"); }, 1300);
}
function startRecord(variant, place, entry){
  S.rec = { variant, place: place ?? null, rate:null, mtai:false, aromas:new Set(), sliders:{}, entry };
  S.correctPick = variant; S.task = "result"; S.overlay = null; render();
}
function applyCorrect(){
  const picked = S.correctPick;
  if (!W[picked]) { toast("デモではこの候補の詳細は用意していません"); return; }
  S.rec.variant = picked; S.task = "result"; render(); toast("訂正内容を保存しました");
}
function setRate(x){ S.rec.rate = S.rec.rate === x ? null : x; render(); }
function toggleAroma(a){ S.rec.aromas.has(a) ? S.rec.aromas.delete(a) : S.rec.aromas.add(a); render(); }
function setPlace(p){ S.rec.place = p === "場所を記録しない" ? null : p; S.placePicker = false; render(); }
function saveRecord(){
  const r = S.rec;
  const rec = { d:"今日", place:r.place, w:r.variant, src:"camera", rate:r.rate, mtai:r.mtai, memo:"", aromas:[...r.aromas] };
  CELLAR = [rec, ...CELLAR];
  S.justSaved = rec; S.rec = null; S.task = null; S.tab = "records"; S.overlay = null;
  render(); toast("この端末に記録を保存しました");
  setTimeout(() => { if (S.justSaved === rec) { S.justSaved = null; render(); } }, 4000);
}
function openWine(id, entry){ S.overlay = id; S.entry = entry ?? "discover"; render(); }
function goShelf(v, hl){
  if (v !== "sepal") { toast("デモではRestaurant Sépalの棚のみ用意しています"); return; }
  S.phase = 2; S.tab = "discover"; S.shelfView = true; S.overlay = null; S.highlight = hl ?? null; render();
}
function setTab(t){ S.tab = t; S.overlay = null; S.shelfView = false; render(); }
function togglePhase(){
  S.phase = S.phase === 0 ? 2 : 0;
  S.tab = S.phase === 0 ? "records" : "home";
  S.overlay = null; S.shelfView = false; render();
  toast(S.phase === 0 ? "Phase 0: 連携店ゼロの状態" : "Phase 2: 連携店が増えた状態");
}
let tt = null;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }

/* ================= root ================= */
function topBar(){
  const ph = `<button class="phasebtn" onclick="togglePhase()">${S.phase === 0 ? "P0" : "P2"}</button>`;
  if (S.tab === "records") return `<div class="brand">Cellar Note</div><span class="sp">${ph}</span>`;
  if (S.tab === "home") return `<div class="brand">Cellar Note</div><span class="sp">
    <button class="area" onclick="toast('デモのためエリア切替は省略しています')">銀座・丸の内 ▾</button>
    <button class="icbtn" onclick="toast('通知はホームに表示しています（デモ）')">${I.bell}<span class="nb">1</span></button>${ph}</span>`;
  if (S.shelfView) return "";
  return `<div class="ttl">探す</div><span class="sp">${S.phase === 2 ? `<button class="area" onclick="toast('デモのためエリア切替は省略しています')">銀座・丸の内 ▾</button>` : ""}${ph}</span>`;
}
function bottomBar(){
  const camBtn = `<button class="camtab" onclick="startCamera()"><span class="ring">${I.cam}</span>撮る</button>`;
  const t = (id, ic, label) => `<button class="tab ${S.tab === id ? "on" : ""}" onclick="setTab('${id}')">${ic}${label}</button>`;
  return `<div class="tabs">${S.phase === 0
    ? t("records", I.note, "記録") + camBtn + t("discover", I.search, "探す")
    : t("home", I.home, "ホーム") + t("discover", I.search, "探す") + camBtn + t("records", I.note, "記録")}</div>`;
}
function render(){
  let html;
  if (S.task === "camera") html = taskCamera();
  else if (S.task === "reading") html = taskReading();
  else if (S.task === "result") html = taskResult();
  else if (S.task === "correct") html = taskCorrect();
  else if (S.task === "details") html = taskDetails();
  else if (S.task === "showcase") html = taskShowcase();
  else {
    const view = S.tab === "records" ? viewRecords()
      : S.tab === "home" ? viewHome()
      : S.shelfView ? viewShelf() : viewDiscover();
    const top = topBar();
    html = `${top ? `<div class="top">${top}</div>` : ""}<div class="view">${view}</div>${bottomBar()}
      ${S.overlay ? ovWine(S.overlay) : ""}`;
  }
  $("scr").innerHTML = html + (S.placePicker ? sheetPlace() : "") + `<div class="toast" id="toast"></div>`;
  fitLabels();
}
window.addEventListener("resize", fitLabels);
const h = location.hash.replace("#", "");
if (h === "empty") CELLAR = [];
if (h === "discover") S.tab = "discover";
if (h === "p2") { S.phase = 2; S.tab = "home"; }
if (h === "shelf") { S.phase = 2; S.tab = "discover"; S.shelfView = true; }
if (h === "shelfjacket") { S.phase = 2; S.tab = "discover"; S.shelfView = true; S.shelfJacket = true; }
if (h === "wine") { S.phase = 2; S.overlay = "w03"; }
if (h === "wine0") S.overlay = "w11";
if (h === "camera") S.task = "camera";
if (h === "result") startRecord("w03", null, "camera");
if (h === "correct") { startRecord("w03", null, "camera"); S.task = "correct"; }
if (h === "details") { startRecord("w03", null, "camera"); S.task = "details"; }
if (h === "showcase") S.task = "showcase";
render();
</script>
</body>
</html>
